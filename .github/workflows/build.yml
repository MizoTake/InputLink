name: Build and Release

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-build:
    runs-on: windows-latest
    if: "!startsWith(github.ref, 'refs/tags/')"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test]"

    - name: Run tests
      run: pytest tests/ -v

    - name: Lint code
      run: |
        ruff check src tests
        mypy src

  build-windows:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[build]"
    
    - name: Build Windows executables
      run: python scripts\build\build.py
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-executables
        path: |
          dist/InputLink-Sender.exe
          dist/InputLink-Receiver.exe
          dist/InputLink-GUI.exe

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Get tag name
      id: tag
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-executables
        path: dist/windows/

    - name: Create release archives
      run: |
        cd dist

        # Create Windows archive
        zip -r "InputLink-${{ steps.tag.outputs.TAG_NAME }}-Windows.zip" windows/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/InputLink-${{ steps.tag.outputs.TAG_NAME }}-Windows.zip
        draft: false
        prerelease: ${{ contains(steps.tag.outputs.TAG_NAME, 'beta') || contains(steps.tag.outputs.TAG_NAME, 'alpha') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
